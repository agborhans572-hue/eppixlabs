  50% { filter: drop-shadow(0 0 14px rgba(100, 185, 230, 0.75)); }
}
path[class*="bond"] {
  animation: bondBreath 5s ease-in-out infinite;
}
path[class*="atom"]:not([class*="bond"]) {
  animation: atomGlow 5s ease-in-out infinite;
  animation-delay: 0.5s;
}
text {
  animation: bondBreath 5s ease-in-out infinite;
  animation-delay: 1s;
}
</style>

