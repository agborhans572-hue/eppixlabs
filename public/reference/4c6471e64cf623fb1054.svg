<text x="133.0" y="133.0" text-anchor="middle" font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="7" font-weight="400" fill="rgba(255,255,255,0.55)">2</text>
<circle cx="21.0" cy="154" r="3.5" fill="#5AADE0" opacity="0.7"/>
<text x="29.0" y="157" font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="8" font-weight="400" fill="rgba(255,255,255,0.55)">Hydrophobic</text>
