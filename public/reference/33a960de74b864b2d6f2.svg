<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636 192" width="636" height="192">
<!-- Peptide Chain: Melanotan II | Mode: light -->
<defs>

<filter id="bond-glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
  <feFlood flood-color="#4A9ED6" flood-opacity="0.2"/>
  <feComposite in2="blur" operator="in"/>
  <feMerge>
    <feMergeNode/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>
<style>
@keyframes connectorPulse {
  0%, 100% { stroke-opacity: 0.25; }
  50% { stroke-opacity: 1; }
}
@keyframes residueGlow {
  0%, 100% { filter: drop-shadow(0 0 2px rgba(74, 158, 214, 0.15)); }
  50% { filter: drop-shadow(0 0 14px rgba(100, 185, 230, 0.75)); }
}
@keyframes textBreath {
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}
line {
  animation: connectorPulse 5s ease-in-out infinite;
}
rect[rx] {
  animation: residueGlow 5s ease-in-out infinite;
  animation-delay: 0.3s;
}
text[font-size="11"], text[font-size="16"] {
  animation: textBreath 5s ease-in-out infinite;
  animation-delay: 0.6s;
}
</style>
