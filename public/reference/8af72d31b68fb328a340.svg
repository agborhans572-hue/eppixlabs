<filter id="bond-glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
  <feFlood flood-color="#7CCAE8" flood-opacity="0.35"/>
  <feComposite in2="blur" operator="in"/>
  <feMerge>
    <feMergeNode/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
@keyframes bondBreath {
  0%, 100% { stroke-opacity: 0.5; }
  50% { stroke-opacity: 1; }
}
@keyframes atomGlow {
  0%, 100% { filter: drop-shadow(0 0 2px rgba(124, 202, 232, 0.2)); }
  50% { filter: drop-shadow(0 0 14px rgba(180, 225, 248, 0.85)); }
}
path[class*="bond"] {
  animation: bondBreath 5s ease-in-out infinite;
}
path[class*="atom"]:not([class*="bond"]) {
  animation: atomGlow 5s ease-in-out infinite;
  animation-delay: 0.5s;
}
text {
  animation: bondBreath 5s ease-in-out infinite;
  animation-delay: 1s;
}
</style>

